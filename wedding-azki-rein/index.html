<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Wedding Of Azki &amp; Rein · 28 November 2026</title>
<meta name="description" content="Undangan Pernikahan Azkiya Tsany Baharsyah &amp; Reineta Dian Kusumawati — Sabtu, 28 November 2026 di Grha Saraswati Wonogiri">
<meta name="color-scheme" content="light">
<meta property="og:title" content="The Wedding Of Azki &amp; Rein">
<meta property="og:description" content="Sabtu, 28 November 2026 · Grha Saraswati, Wonogiri">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/img/azkia.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
:root{
  --bg:#fffdf9;
  --bg2:#f7f3ec;
  --sage:#6b8f71;
  --sage-d:#4d6b52;
  --rose:#c9a9a0;
  --gold:#b8956b;
  --gold-lit:#e8d4b0;
  --text:#3f4540;
  --muted:#7a857c;
  --card:rgba(255,255,255,.92);
  --shadow:0 4px 6px rgba(45,61,50,.04),0 14px 40px rgba(45,61,50,.1);
  --shadow-lg:0 8px 16px rgba(45,61,50,.06),0 28px 60px rgba(45,61,50,.14);
  --shadow-inset:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -2px 8px rgba(45,61,50,.06);
  --glass:linear-gradient(145deg,rgba(255,255,255,.95),rgba(255,252,247,.78));
  --r:20px;
}
html{scroll-behavior:smooth}
body{
  font-family:'Lato',sans-serif;font-weight:300;
  background:var(--bg);color:var(--text);
  overflow-x:clip;line-height:1.75;
  position:relative;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 90% 60% at 50% -10%,rgba(201,169,160,.22),transparent 55%),
    radial-gradient(ellipse 70% 50% at 100% 50%,rgba(107,143,113,.08),transparent 50%),
    radial-gradient(ellipse 70% 50% at 0% 80%,rgba(184,149,107,.1),transparent 45%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;font-weight:500}
.script{font-family:'Great Vibes',cursive;font-weight:400}
.eyebrow{
  font-size:.62rem;letter-spacing:.32em;text-transform:uppercase;
  color:var(--sage);margin-bottom:.75rem;
}
.title-lg{
  font-size:clamp(2.2rem,8vw,3.2rem);
  line-height:1.15;
  background:linear-gradient(165deg,var(--sage-d) 0%,#5a7560 45%,var(--sage) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 1px rgba(255,255,255,.8)) drop-shadow(0 6px 16px rgba(77,107,82,.25));
}
.title-lg .amp{font-family:'Great Vibes',cursive;font-size:1.1em;color:var(--rose);font-weight:400}

/* Loader */
#loader{
  position:fixed;inset:0;z-index:10000;background:#fff;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;
  transition:opacity .4s ease,visibility .4s;
}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.loader-heart{
  width:48px;height:48px;color:var(--sage);
  animation:pulse 1.2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.08);opacity:1}}

/* Particles */
#pc{position:fixed;inset:0;z-index:2;pointer-events:none}

/* Floral decor */
.floral{position:absolute;pointer-events:none;z-index:1;opacity:.85}
.floral.tl{top:0;left:0;width:min(42vw,200px)}
.floral.tr{top:0;right:0;width:min(42vw,200px);transform:scaleX(-1)}
.floral.bl{bottom:0;left:0;width:min(38vw,180px);transform:scaleY(-1)}
.floral.br{bottom:0;right:0;width:min(38vw,180px);transform:scale(-1,-1)}

/* Cover + gerbang */
#cover{
  position:fixed;inset:0;z-index:900;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:clamp(1.5rem,5vw,2.5rem);
  background:#1a1410;
  perspective:1400px;overflow:hidden;
  transition:opacity .6s ease,visibility 0s linear .6s;
}
#cover.open{opacity:0;visibility:hidden;pointer-events:none}
#cover.open .gate-stage{pointer-events:none}

.gate-stage{
  position:absolute;inset:0;z-index:2;
  transform-style:preserve-3d;
  transition:transform 2.4s cubic-bezier(.45,.05,.2,1);
}
#cover.gate-open .gate-stage{transform:translateZ(320px) scale(1.14)}

.gate-light{
  position:absolute;inset:-10%;
  background:
    radial-gradient(ellipse 55% 45% at 50% 42%,rgba(255,248,235,.95) 0%,rgba(255,240,220,.55) 35%,transparent 70%),
    linear-gradient(180deg,#5a7d6a 0%,#8faa92 40%,#fffdf9 100%);
  opacity:.35;transform:scale(.92);
  transition:opacity 2s ease .35s,transform 2.4s cubic-bezier(.45,.05,.2,1) .2s;
}
#cover.gate-open .gate-light{opacity:1;transform:scale(1.15)}

.gate-arch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:min(92vw,420px);z-index:3;pointer-events:none;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.25));
}
.gate-arch svg{width:100%;height:auto;display:block}

.gate-door{
  position:absolute;top:0;bottom:0;width:50.5%;
  background-color:#1f2a24;
  background-image:
    linear-gradient(120deg,rgba(255,255,255,.12) 0%,transparent 35%,rgba(0,0,0,.2) 100%),
    repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0,rgba(0,0,0,.03) 2px,transparent 2px,transparent 14px),
    url('assets/img/floral_wreath.png');
  background-size:auto,auto,cover;
  background-position:center,center,center;
  background-blend-mode:overlay,normal,soft-light;
  border:3px solid rgba(212,175,55,.45);
  box-shadow:
    inset 0 0 80px rgba(0,0,0,.55),
    inset 4px 0 12px rgba(255,255,255,.06),
    8px 0 24px rgba(0,0,0,.45);
  backface-visibility:hidden;
  transition:transform 2.1s cubic-bezier(.65,.04,.25,1);
}
.gate-door::before{
  content:'';position:absolute;top:0;bottom:0;width:18px;
  background:linear-gradient(90deg,rgba(0,0,0,.35),transparent);
  pointer-events:none;
}
.gate-left::before{right:0}
.gate-right::before{left:0;transform:scaleX(-1)}
.gate-knob{
  position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%,var(--gold-lit),var(--gold) 45%,#6b5528);
  box-shadow:0 2px 6px rgba(0,0,0,.5),0 0 0 3px rgba(212,175,55,.25);
  z-index:2;
}
.gate-left .gate-knob{right:14%}
.gate-right .gate-knob{left:14%}
.gate-door::after{
  content:'';position:absolute;top:18%;bottom:18%;width:3px;
  background:linear-gradient(180deg,transparent,var(--gold),transparent);
  opacity:.5;
}
.gate-left{left:0;transform-origin:left center;border-right:1px solid rgba(212,175,55,.5)}
.gate-left::after{right:12%}
.gate-right{right:0;transform-origin:right center;border-left:1px solid rgba(212,175,55,.5)}
.gate-right::after{left:12%}
#cover.gate-open .gate-left{transform:rotateY(-92deg)}
#cover.gate-open .gate-right{transform:rotateY(92deg)}

.gate-floor{
  position:absolute;bottom:0;left:0;right:0;height:18%;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.45));
  z-index:4;pointer-events:none;
}

.cover-ui{
  position:relative;z-index:10;width:100%;
  display:flex;justify-content:center;
  transition:opacity .45s ease,transform .45s ease;
}
#cover.gate-mode .cover-ui{
  opacity:0;transform:translateY(20px) scale(.96);
  pointer-events:none;
}

.cover-inner{
  position:relative;z-index:5;text-align:center;width:100%;max-width:420px;
  padding:2rem 1.5rem 2.5rem;
  background:var(--glass);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:24px;
  box-shadow:0 20px 50px rgba(0,0,0,.35),0 4px 12px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.35);
  animation:fadeUp .9s ease both;
  transform:translateZ(40px);
}
.cover-inner::after{
  content:'';position:absolute;inset:8px;border-radius:18px;pointer-events:none;
  border:1px solid rgba(212,175,55,.25);
  box-shadow:inset 0 0 30px rgba(255,255,255,.15);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.cover-names{
  font-size:clamp(2.8rem,11vw,3.6rem);line-height:1.05;
  color:var(--sage-d);margin:.35rem 0;
}
.cover-names .amp{display:block;font-size:.85em;color:var(--rose);margin:.1em 0}
.cover-date{font-size:.72rem;letter-spacing:.28em;color:var(--muted);margin:.5rem 0 1rem}
.cover-guest{padding:1rem 0;border-top:1px solid rgba(107,143,113,.2);margin:1rem 0}
.cover-gname{
  font-family:'Cormorant Garamond',serif;font-size:1.35rem;
  color:var(--sage-d);font-style:italic;margin-top:.35rem;
}
.btn-buka{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  background:var(--sage);color:#fff;border:none;
  padding:.95rem 2.2rem;border-radius:50px;cursor:pointer;
  font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;
  box-shadow:0 8px 24px rgba(107,143,113,.35);
  transition:transform .3s,box-shadow .3s;
  animation:btnPulse 2s ease-in-out infinite;
}
@keyframes btnPulse{0%,100%{box-shadow:0 8px 24px rgba(107,143,113,.35)}50%{box-shadow:0 8px 32px rgba(107,143,113,.5)}}
.btn-buka:hover{transform:scale(1.04);background:var(--sage-d)}
.btn-buka svg{width:16px;height:16px;fill:currentColor}

/* Main */
#main{display:none;opacity:0;transition:opacity 1s ease;position:relative;z-index:3;isolation:isolate}
#main.ready{display:block;opacity:1}
.sec{
  position:relative;padding:clamp(3.5rem,9vw,5.5rem) clamp(1.1rem,4vw,1.5rem);
  max-width:520px;margin:0 auto;text-align:center;z-index:1;
}
.sec::before{
  content:'';position:absolute;inset:10% 5%;z-index:-1;border-radius:50%;
  background:radial-gradient(circle,rgba(107,143,113,.07),transparent 70%);
  filter:blur(24px);transform:translateZ(0);
}
.card{
  position:relative;
  background:var(--glass);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:var(--r);
  padding:clamp(1.75rem,5vw,2.5rem) clamp(1.25rem,4vw,1.75rem);
  box-shadow:var(--shadow-lg),var(--shadow-inset);
  border:1px solid rgba(255,255,255,.65);
  transform:translateZ(0);
  transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s ease;
}
.card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.5) 0%,transparent 42%,rgba(107,143,113,.04) 100%);
}
.card{transform:translateY(var(--py,0))}
.card:hover{transform:translateY(calc(var(--py,0) - 4px));box-shadow:0 12px 24px rgba(45,61,50,.08),0 32px 64px rgba(45,61,50,.16),var(--shadow-inset)}
.divider{
  width:120px;height:auto;margin:1.25rem auto;opacity:.7;
}

/* Hero in main */
.hero-sec{
  min-height:88svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-top:3rem;
}
.hero-photo{
  width:min(280px,78vw);aspect-ratio:3/4;
  margin:1.25rem auto;
  perspective:900px;
  transform-style:preserve-3d;
}
.hero-photo-inner{
  position:relative;border-radius:20px;overflow:hidden;
  transform:rotateX(4deg) rotateY(-2deg);
  box-shadow:
    0 2px 4px rgba(0,0,0,.06),
    0 20px 40px rgba(45,61,50,.18),
    0 40px 80px rgba(45,61,50,.12);
  border:5px solid #fff;
  transition:transform .6s cubic-bezier(.2,.8,.2,1);
}
.hero-photo-inner::before{
  content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(145deg,rgba(255,255,255,.25) 0%,transparent 40%,rgba(0,0,0,.08) 100%);
}
.hero-photo img{width:100%;height:100%;object-fit:cover;display:block}
.hero-photo-shade{
  position:absolute;bottom:-12px;left:8%;right:8%;height:24px;
  background:radial-gradient(ellipse,rgba(45,61,50,.25),transparent 70%);
  filter:blur(8px);transform:translateZ(-20px);
}
.scroll-hint{
  margin-top:2rem;font-size:.55rem;letter-spacing:.25em;color:var(--muted);
  animation:floatY 2s ease-in-out infinite;
}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

/* Ayat */
.ayat-ar{
  font-family:'Cormorant Garamond',serif;font-size:1.25rem;
  color:var(--sage-d);line-height:1.9;margin-bottom:1rem;
}
.ayat-id{font-style:italic;color:var(--muted);font-size:.95rem}

/* Couple */
.couple-wrap{display:flex;flex-direction:column;gap:2rem;margin-top:1.5rem}
@media(min-width:560px){
  .couple-wrap{flex-direction:row;align-items:flex-start;justify-content:center;gap:1rem}
  .couple-wrap .c-side{flex:1;max-width:200px}
}
.c-frame{
  width:120px;height:120px;margin:0 auto 1rem;border-radius:50%;
  padding:5px;
  background:linear-gradient(145deg,var(--gold-lit),var(--rose),var(--sage));
  box-shadow:0 8px 24px rgba(45,61,50,.15),0 16px 40px rgba(201,169,160,.2);
  transform:translateZ(20px);
}
.c-frame img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #fff}
.c-name{font-size:1.6rem;color:var(--sage-d);margin-bottom:.25rem}
.c-full{font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:1rem;margin-bottom:.5rem}
.c-parent{font-size:.82rem;color:var(--muted);line-height:1.6}
.c-amp{
  font-family:'Great Vibes',cursive;font-size:2.5rem;color:var(--rose);
  align-self:center;padding:.5rem 0;
}

/* Countdown */
.cd-row{display:flex;justify-content:center;gap:.55rem;flex-wrap:wrap;margin:1.5rem 0}
.cd-item{
  min-width:68px;padding:.9rem .5rem;
  background:linear-gradient(165deg,#fff 0%,var(--bg2) 100%);
  border-radius:14px;
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 6px 16px rgba(45,61,50,.1),inset 0 2px 0 #fff,inset 0 -3px 8px rgba(45,61,50,.06);
  transform:translateZ(0);
}
.cd-num{
  display:block;font-family:'Cormorant Garamond',serif;
  font-size:1.85rem;color:var(--sage-d);line-height:1;
}
.cd-lbl{font-size:.5rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-top:.35rem}

/* Events */
.ev{margin-bottom:1rem;text-align:center}
.ev h3{font-size:1.5rem;color:var(--sage-d);margin:.5rem 0}
.ev p{font-size:.88rem;color:var(--muted)}
.ev p strong{color:var(--text);font-weight:400}
.btn-outline{
  display:inline-block;margin-top:1rem;padding:.65rem 1.5rem;
  border:1px solid var(--sage);color:var(--sage-d);border-radius:50px;
  font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;
  transition:.3s;
}
.btn-outline:hover{background:var(--sage);color:#fff}

/* Gallery — horizontal swipe (mobile-friendly) */
.gal-sec{overflow:visible}
.gal-viewport{
  width:100vw;position:relative;left:50%;
  margin:1.25rem 0 0 -50vw;
  overflow:visible;
}
.gal-strip{
  display:flex;gap:.75rem;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
  touch-action:pan-x;
  padding:0 1.25rem .35rem;
  scroll-padding-inline:1.25rem;
  scrollbar-width:none;
}
.gal-strip::-webkit-scrollbar{display:none}
.gal-pad{flex:0 0 1px;scroll-snap-align:none}
.gal-item{
  flex:0 0 min(78vw,280px);
  scroll-snap-align:start;
  border-radius:14px;overflow:hidden;
  aspect-ratio:3/4;
  box-shadow:0 8px 20px rgba(45,61,50,.12),0 24px 48px rgba(45,61,50,.1);
  border:3px solid #fff;
  transform:scale(.98);
  transition:transform .35s ease,box-shadow .35s ease;
}
.gal-item:active,.gal-item:focus-within{transform:scale(1);box-shadow:0 16px 32px rgba(45,61,50,.18)}
.gal-item img{width:100%;height:100%;object-fit:cover;display:block}

/* RSVP */
.rsvp-opts{display:flex;gap:.6rem;margin:.5rem 0}
.rsvp-opt{
  flex:1;padding:.75rem;border:1px solid rgba(107,143,113,.25);
  border-radius:10px;cursor:pointer;font-size:.82rem;color:var(--muted);transition:.25s;
}
.rsvp-opt.sel{background:rgba(107,143,113,.12);border-color:var(--sage);color:var(--sage-d)}
.fg{margin-bottom:1rem;text-align:left}
.fg label{display:block;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sage);margin-bottom:.35rem}
.fi,.fsel{
  width:100%;padding:.8rem 1rem;border:1px solid rgba(107,143,113,.2);
  border-radius:10px;background:#fff;color:var(--text);
  font-family:inherit;font-size:max(.88rem,16px);
}
.fi:focus,.fsel:focus{outline:none;border-color:var(--sage)}
.btn-send{
  width:100%;margin-top:.5rem;padding:1rem;border:none;border-radius:50px;
  background:var(--sage);color:#fff;font-size:.65rem;letter-spacing:.2em;
  text-transform:uppercase;cursor:pointer;transition:.3s;
}
.btn-send:hover{background:var(--sage-d)}
.btn-send.loading{opacity:.6;pointer-events:none}
.wl{margin-top:1.5rem;max-height:320px;overflow-y:auto;text-align:left}
.wc{padding:1rem 0;border-bottom:1px solid rgba(107,143,113,.12)}
.wc-n{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--sage-d)}
.wc-m{font-size:.85rem;color:var(--muted);font-style:italic;margin-top:.25rem}
.wc-t{font-size:.58rem;color:#aaa;margin-top:.4rem;text-transform:uppercase;letter-spacing:.08em}

/* Gift */
.gift-row{display:flex;flex-direction:column;gap:.75rem;margin-top:1rem}
.gift-item{
  padding:1rem;background:var(--bg2);border-radius:12px;
  border:1px solid rgba(107,143,113,.1);
}
.gift-item .num{font-family:'Cormorant Garamond',serif;font-size:1.25rem;color:var(--sage-d);letter-spacing:.06em;margin:.35rem 0}
.btn-copy{
  display:inline-block;margin-top:.5rem;padding:.45rem 1.2rem;
  font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;
  border:1px solid var(--sage);border-radius:50px;cursor:pointer;background:#fff;color:var(--sage-d);
}
.btn-copy:hover{background:var(--sage);color:#fff}

/* Reveal */
.rv{opacity:0;transform:translateY(28px);transition:opacity .85s ease,transform .85s ease}
.rv.on{opacity:1;transform:none}

/* Toast & music */
.toast{
  position:fixed;bottom:5.5rem;left:50%;transform:translateX(-50%) translateY(12px);
  background:#fff;color:var(--sage-d);padding:.65rem 1.25rem;border-radius:50px;
  font-size:.75rem;box-shadow:var(--shadow);opacity:0;transition:.35s;z-index:9999;
  pointer-events:none;border:1px solid rgba(107,143,113,.2);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#mp{
  position:fixed;right:1rem;bottom:5.5rem;z-index:9998;
  width:42px;height:42px;border:none;background:none;cursor:pointer;
  display:none;padding:0;
}
#mp.vis{display:block}
.disc{
  width:100%;height:100%;border-radius:50%;
  background:conic-gradient(#eee,#f5f5f5,#eee);
  box-shadow:0 4px 16px rgba(0,0,0,.12);
  border:2px solid var(--sage);
}
.disc::after{
  content:'';position:absolute;inset:38%;border-radius:50%;
  background:var(--sage);
}
.disc.spin{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#mp{position:fixed}
#mp .disc-wrap{position:relative;width:42px;height:42px}

footer{padding:3rem 1.5rem 5rem;color:var(--muted);font-size:.8rem}
footer .script{font-size:2rem;color:var(--sage-d);display:block;margin-bottom:.5rem}


/* Kedalaman tambahan */
.depth-ev{transform:translateZ(12px)}
.hero-sec{perspective:1000px}
#main.ready .hero-photo-inner{animation:photoFloat 6s ease-in-out infinite}
@keyframes photoFloat{0%,100%{transform:rotateX(4deg) rotateY(-2deg) translateY(0)}50%{transform:rotateX(2deg) rotateY(2deg) translateY(-8px)}}
.btn-buka,.btn-send,.btn-outline{
  box-shadow:0 4px 0 rgba(45,61,50,.2),0 10px 28px rgba(107,143,113,.35);
}
.btn-buka:active,.btn-send:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(45,61,50,.2),0 6px 16px rgba(107,143,113,.3)}
.gift-item{
  background:linear-gradient(160deg,#fff,var(--bg2));
  box-shadow:var(--shadow),inset 0 1px 0 #fff;
}
.fi,.fsel{box-shadow:inset 0 2px 6px rgba(45,61,50,.06);background:linear-gradient(180deg,#fff,#faf8f5)}
#pc{z-index:4}

@media(prefers-reduced-motion:reduce){
  *,.btn-buka{animation:none!important;transition-duration:.01ms!important}
  #main.ready .hero-photo-inner{animation:none!important}
  #cover.gate-open .gate-left,#cover.gate-open .gate-right{transform:none}
  #cover.gate-open .gate-stage{transform:none}
}
</style>
</head>

      <path fill="url(#g)" d="M200 4 L392 98 L8 98 Z" filter="drop-shadow(0 6px 8px rgba(0,0,0,.3))"/>

<script>
const API='https://script.google.com/macros/s/AKfycbzy9tiym46a0FFCV6M3iFYU9GoGKdXceIuwHTr9LygUBg_DYIdlRW7lnxpfyDThcl9NMw/exec';
let attendVal='y', mainMounted=false;

(function(){
  const p=new URLSearchParams(location.search);
  const g=p.get('untuk')||p.get('to')||'';
  if(g) document.getElementById('guestName').textContent=decodeURIComponent(g.replace(/\+/g,' '));
})();

window.addEventListener('load',()=>{
  setTimeout(()=>document.getElementById('loader').classList.add('hide'),600);
});

function mountMain(){
  if(mainMounted) return;
  mainMounted=true;
  const tpl=document.getElementById('main-template');
  const main=document.getElementById('main');
  main.innerHTML=tpl.textContent;
}

let gateOpening=false;
const GATE_MS=2800;

function revealMain(){
  mountMain();
  const main=document.getElementById('main');
  main.classList.add('ready');
  document.getElementById('mp').classList.add('vis');
  document.getElementById('disc').classList.add('spin');
  const bgm=document.getElementById('bgm');
  bgm.volume=.35;
  bgm.play().catch(()=>{});
  setTimeout(initReveal,200);
  startCountdown();
  initParticles();
  loadWishes();
}

function bukaUndangan(){
  if(gateOpening) return;
  gateOpening=true;
  const btn=document.getElementById('btnBuka');
  if(btn) btn.disabled=true;

  const cover=document.getElementById('cover');
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  mountMain();

  if(reduced){
    cover.classList.add('gate-mode','gate-open','open');
    revealMain();
    return;
  }

  cover.classList.add('gate-mode');
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>cover.classList.add('gate-open'));
  });

  setTimeout(()=>{
    cover.classList.add('open');
    revealMain();
  },GATE_MS);
}

function initReveal(){
  const io=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}
    });
  },{threshold:.06,rootMargin:'0px 0px -30px 0px'});
  document.querySelectorAll('.rv').forEach(el=>io.observe(el));
  initParallax();
}
function initParallax(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const hero=document.getElementById('heroPhoto');
  const cards=document.querySelectorAll('.card');
  let ticking=false;
  function onScroll(){
    if(ticking) return;
    ticking=true;
    requestAnimationFrame(()=>{
      const y=window.scrollY;
      if(hero){
        const inner=hero.querySelector('.hero-photo-inner');
        if(inner) inner.style.transform=`rotateX(${4+y*.008}deg) rotateY(${-2+y*.004}deg) translateY(${y*.06}px)`;
      }
      cards.forEach(c=>{
        const r=c.getBoundingClientRect();
        const mid=r.top+r.height/2-innerHeight/2;
        c.style.setProperty('--py',(mid*.025).toFixed(2)+'px');
      });
      ticking=false;
    });
  }
  window.addEventListener('scroll',onScroll,{passive:true});
  onScroll();
}

function startCountdown(){
  const tgt=new Date('2026-11-28T08:00:00+07:00').getTime();
  function tick(){
    const d=Math.max(0,tgt-Date.now());
    setN('cd-days',Math.floor(d/864e5));
    setN('cd-hours',Math.floor((d%864e5)/36e5));
    setN('cd-mins',Math.floor((d%36e5)/6e4));
    setN('cd-secs',Math.floor((d%6e4)/1e3));
  }
  tick();setInterval(tick,1000);
}
function setN(id,v){
  const el=document.getElementById(id);
  if(el) el.textContent=String(v).padStart(2,'0');
}

function setAttend(v){
  attendVal=v;
  document.getElementById('optY').classList.toggle('sel',v==='y');
  document.getElementById('optN').classList.toggle('sel',v==='n');
  document.getElementById('jmlGrp').style.display=v==='y'?'block':'none';
}

async function submitRSVP(){
  const nameEl=document.getElementById('rn');
  const name=nameEl.value.trim();
  if(!name){nameEl.style.borderColor='#c66';nameEl.focus();setTimeout(()=>nameEl.style.borderColor='',2000);return}
  const count=attendVal==='y'?(document.getElementById('rcount').value||1):0;
  const msg=document.getElementById('rmsg').value.trim();
  const btn=document.getElementById('submitBtn');
  btn.classList.add('loading');
  btn.querySelector('span').textContent='Mengirim…';
  const params=new URLSearchParams({action:'submit',nama:name,kehadiran:attendVal==='y'?'Hadir':'Tidak Hadir',jumlah:count,pesan:msg});
  try{await fetch(`${API}?${params}`,{method:'GET',mode:'no-cors'})}catch(e){console.warn('RSVP:',e)}
  if(msg){
    const c=document.createElement('div');c.className='wc';
    c.innerHTML=`<p class="wc-n">${esc(name)}</p><p class="wc-m">${esc(msg)}</p><p class="wc-t">Baru saja</p>`;
    document.getElementById('wishList').prepend(c);
  }
  document.getElementById('rsvpForm').style.display='none';
  document.getElementById('rsvpOk').style.display='block';
  setTimeout(loadWishes,3000);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

async function loadWishes(){
  const box=document.getElementById('wishList');
  if(!box) return;
  try{
    const res=await fetch(`${API}?action=getWishes`);
    const data=await res.json();
    if(Array.isArray(data)){
      if(!data.length){box.innerHTML='<p style="text-align:center;color:var(--muted);font-style:italic;padding:1.5rem 0">Belum ada ucapan. Jadilah yang pertama!</p>';return}
      box.innerHTML='';
      data.forEach(w=>{
        const c=document.createElement('div');c.className='wc';
        c.innerHTML=`<p class="wc-n">${esc(w.nama)}</p><p class="wc-m">${esc(w.pesan)}</p><p class="wc-t">${esc(w.waktu||'')}</p>`;
        box.appendChild(c);
      });
    }
  }catch(e){
    console.warn('Wishes:',e);
    box.innerHTML='<p style="text-align:center;color:var(--muted);font-style:italic;padding:1.5rem 0">Gagal memuat ucapan.</p>';
  }
}

function toggleMusic(){
  const b=document.getElementById('bgm'),d=document.getElementById('disc');
  if(b.paused){b.play();d.classList.add('spin')}else{b.pause();d.classList.remove('spin')}
}

function copyAcc(n){
  if(navigator.clipboard)navigator.clipboard.writeText(n).then(toast).catch(()=>fbCopy(n));
  else fbCopy(n);
}
function fbCopy(n){const t=document.createElement('textarea');t.value=n;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);toast()}
function toast(){const t=document.getElementById('copyToast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

const CV=document.getElementById('pc'),CX=CV.getContext('2d');
let pts=[],ptOn=false;
function rcv(){CV.width=innerWidth;CV.height=innerHeight}
addEventListener('resize',rcv);rcv();
class Pt{
  constructor(){this.reset()}
  reset(){this.x=Math.random()*CV.width;this.y=CV.height+6;this.r=Math.random()*2+.4;this.vy=-(Math.random()*.4+.12);this.vx=(Math.random()-.5)*.2;this.op=Math.random()*.25+.08;this.fade=Math.random()*.002+.0008}
  step(){this.y+=this.vy;this.x+=this.vx;this.op-=this.fade;if(this.op<=0||this.y<-6)this.reset()}
  draw(){CX.beginPath();CX.arc(this.x,this.y,this.r,0,Math.PI*2);CX.fillStyle=`rgba(107,143,113,${this.op})`;CX.fill()}
}
function initParticles(){
  if(ptOn)return;
  const n=Math.min(innerWidth<480?18:36,Math.floor(innerWidth/22));
  pts=Array.from({length:n},()=>{const p=new Pt();p.y=Math.random()*CV.height;return p});
  ptOn=true;animP();
}
function animP(){if(!ptOn)return;CX.clearRect(0,0,CV.width,CV.height);pts.forEach(p=>{p.step();p.draw()});requestAnimationFrame(animP)}
document.addEventListener('visibilitychange',()=>{ptOn=!document.hidden;if(ptOn)animP()});
</script>
</body>
</html>
